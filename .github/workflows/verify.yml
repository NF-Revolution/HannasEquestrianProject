name: Verify

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Unit tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Add properties to local.properties
        run: |
          echo "INSTAGRAM_URL=${{ vars.INSTAGRAM_URL }}" >> local.properties
          echo "YOUTUBE_URL=${{ vars.YOUTUBE_URL }}" >> local.properties
          echo "TIKTOK_URL=${{ vars.TIKTOK_URL }}" >> local.properties
          echo "STORAGE_URL=${{ vars.STORAGE_URL }}" >> local.properties
          echo "DATABASE_URL_HOST=${{ vars.DATABASE_URL_HOST }}" >> local.properties
          echo "ENABLE_BROWSER_SYNC=${{ vars.ENABLE_BROWSER_SYNC }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew jvmTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Add properties to local.properties
        run: |
          echo "INSTAGRAM_URL=${{ vars.INSTAGRAM_URL }}" >> local.properties
          echo "YOUTUBE_URL=${{ vars.YOUTUBE_URL }}" >> local.properties
          echo "TIKTOK_URL=${{ vars.TIKTOK_URL }}" >> local.properties
          echo "STORAGE_URL=${{ vars.STORAGE_URL }}" >> local.properties
          echo "DATABASE_URL_HOST=${{ vars.DATABASE_URL_HOST }}" >> local.properties
          echo "ENABLE_BROWSER_SYNC=${{ vars.ENABLE_BROWSER_SYNC }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon --stacktrace
